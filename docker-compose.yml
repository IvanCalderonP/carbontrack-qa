services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carbontrack
      POSTGRES_PASSWORD: carbontrack
      POSTGRES_DB: carbontrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbontrack -d carbontrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://carbontrack:carbontrack@postgres:5432/carbontrack
      SECRET_KEY: ${SECRET_KEY:-local-demo-secret-change-before-deployment}
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
