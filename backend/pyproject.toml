[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI's Query defaults are evaluated once for route metadata.

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
omit = ["app/db/seed.py"]
